[package]
name = "ferro-forge-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.0"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

[dependencies.ferro-forge]
path = ".."

[[bin]]
name = "decode_and_verify"
path = "fuzz_targets/decode_and_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_claims"
path = "fuzz_targets/signed_claims.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_header"
path = "fuzz_targets/signed_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false
